<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>珠珠的小窝 🐾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    /* ===== 全局重置 & 基础 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(-45deg, #FFF5F5, #FFF0EB, #F0F8FF, #FFF0F5, #FFF5FA, #FFEDE0, #FFF5F5);
      background-size: 600% 600%;
      animation: bgShift 20s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      line-height: 1.6;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== 背景浮动装饰 ===== */
    .bg-deco {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
      animation: floatDeco 12s ease-in-out infinite;
      font-size: 96px;
      line-height: 1;
    }

    .bg-deco:nth-child(1) { top: 6%; left: 4%; animation-delay: 0s; }
    .bg-deco:nth-child(2) { top: 15%; right: 6%; animation-delay: 3s; font-size: 72px; }
    .bg-deco:nth-child(3) { bottom: 20%; left: 6%; animation-delay: 6s; font-size: 80px; }
    .bg-deco:nth-child(4) { bottom: 12%; right: 5%; animation-delay: 9s; font-size: 64px; }

    @keyframes floatDeco {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-12px) rotate(4deg); }
      50% { transform: translateY(4px) rotate(-2deg); }
      75% { transform: translateY(-6px) rotate(2deg); }
    }

    /* ===== 布局容器 — 仅做左右排列，无背景 ===== */
    .layout-wrapper {
      max-width: 860px;
      width: 100%;
      display: flex;
      gap: 28px;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    .left-col {
      flex: 0 0 300px;
      min-width: 0;
    }

    .right-col {
      flex: 1;
      min-width: 0;
      position: sticky;
      top: 20px;
    }

    /* ===== 头部 — 玻璃卡片风格的头像区 ===== */
    .header {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 32px 26px 34px 24px;
      border: 2.5px dashed rgba(255, 209, 220, 0.65);
      padding: 28px 20px 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(255, 183, 197, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .header:hover {
      box-shadow: 0 12px 40px rgba(255, 183, 197, 0.25);
      transform: translateY(-1px);
    }

    .avatar-wrapper {
      margin-bottom: 10px;
      position: relative;
    }
    /* 头像周围的装饰小花 */
    .avatar-wrapper::before {
      content: '🌸';
      position: absolute;
      top: -8px;
      right: -10px;
      font-size: 18px;
      animation: floatDeco 6s ease-in-out infinite;
      transform-origin: center;
    }
    .avatar-wrapper::after {
      content: '⭐';
      position: absolute;
      bottom: -4px;
      left: -8px;
      font-size: 14px;
      animation: floatDeco 8s ease-in-out infinite;
      animation-delay: 2s;
      transform-origin: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      border: 3.5px solid #FF8FA3;
      box-shadow: 0 6px 0 #FFB3C1;
      transition: transform 0.3s ease;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar:hover {
      transform: scale(1.05) rotate(-3deg);
    }

    .name {
      font-size: 30px;
      font-weight: 400;
      font-family: 'ZCOOL KuaiLe', cursive;
      color: #FF6B8A;
      letter-spacing: 3px;
      margin-bottom: 4px;
      position: relative;
    }
    .name::after {
      content: '✦ ✦ ✦';
      display: block;
      font-size: 10px;
      letter-spacing: 6px;
      color: #FFD1DC;
      margin-top: 4px;
    }

    .tagline {
      font-size: 16px;
      color: #FF8FA3;
      background: rgba(255, 240, 243, 0.7);
      padding: 4px 18px;
      border-radius: 20px;
      border: 2px dashed rgba(255, 179, 193, 0.6);
      display: inline-block;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-weight: 400;
    }

    /* ===== 通用毛玻璃卡片 ===== */
    .card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px 24px 30px 22px;
      border: 2.5px dashed rgba(255, 209, 220, 0.65);
      padding: 20px 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(255, 183, 197, 0.18);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover {
      box-shadow: 0 12px 40px rgba(255, 183, 197, 0.25);
      transform: translateY(-1px);
    }

    .card-title {
      font-size: 18px;
      font-weight: 400;
      font-family: 'ZCOOL KuaiLe', cursive;
      color: #FF6B8A;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '✿';
      font-size: 16px;
      color: #FFB3C1;
    }
    .card-title::after {
      content: '✿';
      font-size: 16px;
      color: #FFB3C1;
      margin-left: auto;
    }

    /* ===== 个人信息区 ===== */
    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 14px;
      color: #555;
    }

    .info-row .label {
      font-weight: 700;
      color: #FF8FA3;
      white-space: nowrap;
      min-width: 72px;
      flex-shrink: 0;
    }

    .info-row .value {
      color: #444;
    }

    .info-row .icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    /* ===== 兴趣标签 ===== */
    .interest-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      background: #E8F8FF;
      border: 2px solid #B5E6FF;
      border-radius: 14px;
      padding: 3px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #4A9BC7;
    }

    .tag:nth-child(2) {
      background: #FFF0E6;
      border-color: #FFD4A8;
      color: #D4956A;
    }

    .tag:nth-child(3) {
      background: #FFF0F3;
      border-color: #FFB3C1;
      color: #E06B80;
    }

    /* ===== 日常轮播 ===== */
    .carousel-card {
      padding-bottom: 14px;
    }
    .carousel {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: #F5F0F0;
      aspect-ratio: 1 / 1;
    }
    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.4s ease;
    }
    .carousel-track img {
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      object-fit: cover;
      display: block;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      color: #D6456A;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 2;
    }
    .carousel-btn:hover {
      background: rgba(255, 255, 255, 0.85);
    }
    .carousel-prev { left: 8px; }
    .carousel-next { right: 8px; }
    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 2;
    }
    .carousel-dots .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: all 0.25s;
    }
    .carousel-dots .dot.active {
      background: #FFF;
      border-color: #FF8FA3;
      transform: scale(1.25);
    }

    /* ===== 聊天区 ===== */
    .chat-card {
      padding: 0;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #FFD1DC, #B5E6FF);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2.5px solid #FFB3C1;
    }

    .chat-header .avatar-mini {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #FF8FA3;
      flex-shrink: 0;
    }

    .chat-header .avatar-mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .chat-header .info {
      flex: 1;
    }

    .chat-header .info .name-mini {
      font-size: 15px;
      font-weight: 400;
      font-family: 'ZCOOL KuaiLe', cursive;
      color: #D6456A;
    }

    .chat-header .info .status {
      font-size: 12px;
      color: #8B5A6A;
    }

    .chat-header .info .status .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #4ADE80;
      border-radius: 50%;
      margin-right: 4px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .chat-header .reset-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #FF8FA3;
      background: rgba(255,255,255,0.6);
      color: #D6456A;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .chat-header .reset-btn:hover {
      background: #FFF;
      transform: rotate(-30deg);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== 消息区域 ===== */
    .chat-messages {
      height: 460px;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(255, 250, 251, 0.5);
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: #FFF0F3;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #FFD1DC;
      border-radius: 10px;
    }

    .message {
      display: flex;
      gap: 8px;
      max-width: 88%;
      animation: messageIn 0.3s ease-out;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message .bubble {
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      position: relative;
      word-break: break-word;
    }

    .message.bot .bubble {
      background: #FFF;
      border: 2px solid #FFD1DC;
      border-bottom-left-radius: 4px;
      color: #444;
      margin-left: 4px;
    }

    /* Bot bubble tail (points left) */
    .message.bot .bubble::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 14px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 9px solid #FFD1DC;
    }
    .message.bot .bubble::after {
      content: '';
      position: absolute;
      left: -6px;
      top: 14px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 9px solid #FFF;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #FFD1DC, #FFB3C1);
      border: 2px solid #FF8FA3;
      border-bottom-right-radius: 4px;
      color: #5A3A40;
      font-weight: 500;
      margin-right: 4px;
    }

    /* User bubble tail (points right) */
    .message.user .bubble::before {
      content: '';
      position: absolute;
      right: -10px;
      top: 14px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 9px solid #FF8FA3;
    }
    .message.user .bubble::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 14px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 9px solid #FFC8D0;
    }

    .message .avatar-msg {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #FF8FA3;
      flex-shrink: 0;
    }

    .message .avatar-msg img,
    .typing-indicator .avatar-msg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== 输入区 ===== */
    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 2px solid #FFE4E9;
      background: #FFF5F7;
    }

    .chat-input-area input {
      flex: 1;
      border: 2.5px solid #FFD1DC;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      background: #FFF;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .chat-input-area input:focus {
      border-color: #FF8FA3;
    }

    .chat-input-area input::placeholder {
      color: #FFB3C1;
    }

    .chat-input-area button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid #FF8FA3;
      background: linear-gradient(135deg, #FFD1DC, #FFB3C1);
      color: #FFF;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .chat-input-area button:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #FFB3C1, #FF8FA3);
    }

    .chat-input-area button:active {
      transform: scale(0.95);
    }

    .chat-input-area button:disabled,
    .chat-input-area input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== 快捷提问 ===== */
    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 16px 6px;
      background: #FFF5F7;
    }

    .quick-q-btn {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      border: 1.5px solid #B5E6FF;
      background: #F0FAFF;
      color: #4A9BC7;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }

    .quick-q-btn:hover {
      background: #B5E6FF;
      color: #FFF;
      border-color: #7CC8E8;
    }

    /* ===== 底部 ===== */
    .footer {
      text-align: center;
      margin-top: 8px;
      font-size: 12px;
      color: #FFB3C1;
    }

    .footer a {
      color: #FF8FA3;
      text-decoration: none;
      font-weight: 600;
    }

    /* ===== 打字指示器 ===== */
    .typing-indicator {
      align-self: flex-start;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 0;
      animation: messageIn 0.3s ease-out;
    }

    .typing-indicator .avatar-msg {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #FF8FA3;
      flex-shrink: 0;
    }

    .typing-indicator .dots {
      display: flex;
      gap: 4px;
      background: #FFF;
      border: 2px solid #FFD1DC;
      border-radius: 14px;
      padding: 10px 16px;
    }

    .typing-indicator .dots span {
      width: 7px;
      height: 7px;
      background: #FFB3C1;
      border-radius: 50%;
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-indicator .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }
    .typing-indicator .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ===== 小窝氛围：屋顶装饰 ===== */
    .roof-banner {
      text-align: center;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 26px;
      color: #D6456A;
      padding: 14px 28px 16px;
      max-width: 400px;
      margin: 0 auto 10px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2.5px dashed rgba(255, 209, 220, 0.65);
      border-radius: 40px 40px 20px 20px;
      box-shadow: 0 4px 24px rgba(255, 183, 197, 0.12);
      position: relative;
      z-index: 1;
      letter-spacing: 4px;
    }
    .roof-banner::before {
      content: '╱╲╱╲╱╲╱╲╱╲';
      display: block;
      font-size: 10px;
      letter-spacing: 6px;
      color: rgba(255, 179, 193, 0.5);
      margin-bottom: 2px;
    }

    /* ===== 小窝氛围：底部花草 ===== */
    .grass-deco {
      text-align: center;
      font-size: 22px;
      letter-spacing: 10px;
      opacity: 0.5;
      margin-top: 8px;
      z-index: 1;
      position: relative;
      pointer-events: none;
      line-height: 1;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      body { padding: 12px 10px 30px; }
      .layout-wrapper { flex-direction: column; gap: 16px; }
      .left-col { flex: none; width: 100%; }
      .right-col { flex: none; width: 100%; }
      .header { padding: 22px 16px 18px; border-radius: 22px; }
      .card { padding: 16px 16px; border-radius: 20px; }
      .avatar { width: 80px; height: 80px; }
      .name { font-size: 24px; }
      .tagline { font-size: 14px; }
      .chat-messages { height: 280px; }
      .message { max-width: 92%; }
      .roof-banner { font-size: 20px; padding: 10px 18px 12px; }
      .bg-deco { display: none; }
      .grass-deco { font-size: 16px; letter-spacing: 6px; margin-top: 4px; }
    }
  </style>
</head>
<body>

<div class="bg-deco">☁️</div>
<div class="bg-deco">✨</div>
<div class="bg-deco">🐾</div>
<div class="bg-deco">🌟</div>

<div class="roof-banner">
  <span>🏠 珠珠的小窝 🐾</span>
</div>

<div class="layout-wrapper">

  <!-- ===== 左栏：资料区 ===== -->
  <div class="left-col">

    <div class="header">
      <div class="avatar-wrapper">
        <div class="avatar"><img src="image.jpg" alt="珠珠" /></div>
      </div>
      <div class="name">珠珠</div>
      <div class="tagline">一个正在快乐成长的小胖子 ✨</div>
    </div>

    <!-- ===== 珠珠的日常轮播（图片由 JS 动态加载） ===== -->
    <div class="card carousel-card" id="dailyCard" style="display:none">
      <div class="card-title">珠珠的日常</div>
      <div class="carousel" id="carousel">
        <div class="carousel-track" id="carouselTrack"></div>
        <button class="carousel-btn carousel-prev" id="carouselPrev" aria-label="上一张">‹</button>
        <button class="carousel-btn carousel-next" id="carouselNext" aria-label="下一张">›</button>
        <div class="carousel-dots" id="carouselDots"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">关于珠珠</div>
      <div class="info-grid">
        <div class="info-row">
          <span class="icon">🏷️</span>
          <span class="label">职业身份</span>
          <span class="value">干饭兼巡逻大队长</span>
        </div>
        <div class="info-row">
          <span class="icon">🌟</span>
          <span class="label">最近在做</span>
          <span class="value">等妈妈回家带我遛弯和玩耍 🐾</span>
        </div>
        <div class="info-row">
          <span class="icon">❤️</span>
          <span class="label">兴趣爱好</span>
          <span class="value">干饭、睡觉和窝粑粑 💤</span>
        </div>
        <div class="info-row">
          <span class="icon">🤗</span>
          <span class="label">性格特点</span>
          <span class="value">特别亲人，遇到陌生人都会上前讨要摸摸</span>
        </div>
      </div>
      <div class="interest-tags">
        <span class="tag">🍚 干饭</span>
        <span class="tag">😴 睡觉</span>
        <span class="tag">💩 窝粑粑</span>
        <span class="tag">🐾 遛弯</span>
        <span class="tag">🤗 讨摸摸</span>
      </div>
    </div>

    <div class="footer">
      珠珠的小窝 🐾 &middot; 给爸爸妈妈看的快乐小站
    </div>

  </div>

  <!-- ===== 右栏：聊天区 ===== -->
  <div class="right-col">

    <div class="card chat-card">
      <div class="chat-header">
        <div class="avatar-mini"><img src="image.jpg" alt="珠珠" /></div>
        <div class="info">
          <div class="name-mini">珠珠 · AI 数字分身</div>
          <div class="status"><span class="dot"></span>在线，找我聊天呀~</div>
        </div>
        <button class="reset-btn" id="resetBtn" title="新对话">⟳</button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- 由 JS 动态渲染消息 -->
      </div>

      <div class="quick-questions" id="quickQuestions"></div>

      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="给珠珠发条消息..." autocomplete="off" />
        <button id="sendBtn" title="发送">➤</button>
      </div>
    </div>

  </div>

</div>

<div class="grass-deco">🌱 🌿 🌸 🐾 🌸 🌿 🌱</div>

<script>
  // ===== 聊天历史（纯前端存储，全部发送给后端） =====
  const MSGS_KEY = 'zhuzhu_chat';
  let chatHistory = [];

  function saveHistory() {
    try { localStorage.setItem(MSGS_KEY, JSON.stringify(chatHistory)); } catch (_) {}
  }

  function loadHistory() {
    try {
      const saved = localStorage.getItem(MSGS_KEY);
      if (saved) { chatHistory = JSON.parse(saved); return true; }
    } catch (_) {}
    return false;
  }

  function clearHistory() {
    try { localStorage.removeItem(MSGS_KEY); } catch (_) {}
  }

  // ===== DOM 引用 =====
  const messagesEl = document.getElementById('chatMessages');
  const inputEl = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');
  const quickEl = document.getElementById('quickQuestions');
  let isLoading = false;

  // ===== 快捷问题 =====
  const QUICK_QS = [
    '你现在在干什么？',
    '你爸比是谁？',
    '你妈咪是谁？',
  ];

  QUICK_QS.forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'quick-q-btn';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      if (isLoading) return;
      sendMessage(text);
    });
    quickEl.appendChild(btn);
  });

  // ===== UI 渲染 =====
  function renderMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'message ' + sender;

    if (sender === 'bot') {
      const avatar = document.createElement('div');
      avatar.className = 'avatar-msg';
      const img = document.createElement('img');
      img.src = 'image.jpg';
      img.alt = '珠珠';
      avatar.appendChild(img);
      div.appendChild(avatar);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(text, sender) {
    renderMessage(text, sender);
    chatHistory.push({ sender, text });
    saveHistory();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typingIndicator';

    const avatar = document.createElement('div');
    avatar.className = 'avatar-msg';
    const img = document.createElement('img');
    img.src = 'image.jpg';
    img.alt = '珠珠';
    avatar.appendChild(img);
    div.appendChild(avatar);

    const dots = document.createElement('div');
    dots.className = 'dots';
    for (let i = 0; i < 3; i++) {
      const span = document.createElement('span');
      dots.appendChild(span);
    }
    div.appendChild(dots);

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function showError(text) {
    const div = document.createElement('div');
    div.style.cssText = 'text-align:center;padding:8px 12px;font-size:13px;color:#D6456A;background:#FFF0F3;border-radius:10px;margin:4px 0;';
    div.textContent = '❌ ' + text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ===== 日常轮播（从后端自动获取图片） =====
  (async function initCarousel() {
    const card = document.getElementById('dailyCard');
    const track = document.getElementById('carouselTrack');
    const prevBtn = document.getElementById('carouselPrev');
    const nextBtn = document.getElementById('carouselNext');
    const dotsEl = document.getElementById('carouselDots');
    if (!track) return;

    // 从 API 获取图片列表
    var files;
    try {
      var res = await fetch('/api/images');
      if (!res.ok) return;
      files = await res.json();
    } catch (_) { return; }
    if (!files || files.length === 0) return;

    // 构建图片
    var total = files.length;
    for (var i = 0; i < total; i++) {
      var img = document.createElement('img');
      img.src = 'pic/' + files[i];
      img.alt = '日常 ' + (i + 1);
      track.appendChild(img);
    }

    // 显示卡片
    card.style.display = '';

    // 只有 1 张图不显示控件
    if (total < 2) {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      dotsEl.style.display = 'none';
      return;
    }

    var current = 0;
    var timer = null;
    var INTERVAL = 3500;

    function goTo(index) {
      if (index < 0) index = total - 1;
      if (index >= total) index = 0;
      current = index;
      track.style.transform = 'translateX(-' + (current * 100) + '%)';
      var dots = dotsEl.querySelectorAll('.dot');
      for (var d = 0; d < dots.length; d++) {
        dots[d].classList.toggle('active', d === current);
      }
    }

    function advance() { goTo(current + 1); }

    function startAuto() {
      stopAuto();
      timer = setInterval(advance, INTERVAL);
    }
    function stopAuto() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    // 创建圆点
    for (var j = 0; j < total; j++) {
      (function (idx) {
        var dot = document.createElement('span');
        dot.className = 'dot' + (idx === 0 ? ' active' : '');
        dot.addEventListener('click', function () {
          goTo(idx);
          startAuto();
        });
        dotsEl.appendChild(dot);
      })(j);
    }

    // 按钮事件
    prevBtn.addEventListener('click', function () { goTo(current - 1); startAuto(); });
    nextBtn.addEventListener('click', function () { goTo(current + 1); startAuto(); });

    // 悬停/触摸暂停
    var el = document.getElementById('carousel');
    el.addEventListener('mouseenter', stopAuto);
    el.addEventListener('mouseleave', startAuto);
    el.addEventListener('touchstart', stopAuto);
    el.addEventListener('touchend', startAuto);

    startAuto();
  })();

  // ===== API 调用 =====
  async function sendMessage(text) {
    const msg = (text || inputEl.value).trim();
    if (!msg || isLoading) return;

    addMessage(msg, 'user');
    inputEl.value = '';
    isLoading = true;
    showTyping();

    inputEl.disabled = true;
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, history: chatHistory }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || '请求失败 (' + res.status + ')');
      }

      const data = await res.json();
      hideTyping();
      addMessage(data.reply, 'bot');
    } catch (err) {
      hideTyping();
      if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
        showError('服务器连接失败，请稍后重试');
      } else {
        showError(err.message || '出错了，请稍后重试');
      }
    } finally {
      isLoading = false;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ===== 重置对话 =====
  async function resetChat() {
    if (isLoading) return;
    clearHistory();
    chatHistory = [];
    messagesEl.innerHTML = '';
    addMessage('你好呀～新的一轮聊天开始啦 🐱✨ 我是珠珠，想问什么尽管说～', 'bot');
  }

  // ===== 事件绑定 =====
  sendBtn.addEventListener('click', function () { sendMessage(); });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !isLoading) sendMessage();
  });
  resetBtn.addEventListener('click', resetChat);

  // ===== 初始加载：恢复历史消息或显示欢迎 =====
  (function init() {
    if (loadHistory()) {
      chatHistory.forEach(function (msg) {
        renderMessage(msg.text, msg.sender);
      });
    } else {
      addMessage('你好呀～欢迎来到我的小窝 🐱✨ 我是珠珠，一个正在快乐成长的小胖子！随便问我什么都可以～', 'bot');
    }
  })();
</script>

</body>
</html>
